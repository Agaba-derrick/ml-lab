name: ML Lab CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Run Test Suite (Pytest)
        run: |
          pytest -v --durations=10

      - name: Verify Training Pipeline Script
        run: |
          python 01_iris_project/iris_project.py

  deploy-to-huggingface:
    name: Deploy to Hugging Face Spaces
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.ML_AI || vars.HF_TOKEN || vars.ML_AI }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Neither HF_TOKEN nor ML_AI secret was found. Please ensure a secret is added under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Deploy: clean application snapshot to Hugging Face Spaces"
          git push --force https://agaba-derrick:$HF_TOKEN@huggingface.co/spaces/agaba-derrick/ML-AI hf-deploy:main
